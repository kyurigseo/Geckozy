name: Integrated Monorepo CD (Frontend + Backend)

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Backend with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew build -x test
