name: CD with Gradle

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle Wrapper
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Transfer Build File using SCP
        uses: appleboy/scp-action@master
        with:
          username: ubuntu
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/home/ubuntu/geckozy/"
          strip_components: 3
          rm: true

      - name: docker compose up -> make (mysql, spring, nginx)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/geckozy
            docker compose up -d --build
            docker image prune -f